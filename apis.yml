aid: matrix-partners
name: Matrix Partners
description: >-
  Matrix Partners (now branded simply "Matrix") is an early-stage venture capital firm founded in 1977 by
  Paul Ferri, investing from idea through Series A. Headquartered in San Francisco at 535 Mission Street with
  a long-standing East Coast office in Cambridge, Massachusetts, the firm is run by former founders and
  company builders who describe themselves as "contrarians who invest with conviction," backing founders with
  deep technical expertise and a specific vision of the future. Matrix is a generalist early-stage investor
  across AI / frontier tech, B2B and enterprise software, fintech, consumer, healthtech, infrastructure, and
  semiconductors, typically writing seed and Series A checks and leading rounds. Over nearly five decades the
  firm has backed foundational technology and consumer companies including Apple, HubSpot, Zendesk, Canva,
  Afterpay, Oculus, Fivetran, Flock Safety, Quora, Postmates, GOAT, and Suno, with a track record spanning
  semiconductors and networking through today's AI-native startups.
